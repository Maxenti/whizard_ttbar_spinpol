[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whizard-ttbar-qis"
version = "1.0.0"
description = "WHIZARD+PYTHIA8 top-spin tomography and collider quantum-information framework"
readme = "README_QIS.md"
requires-python = ">=3.10"
authors = [{name = "CFDCH / WHIZARD ttbar spin-polarization project"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
hep = ["uproot>=5", "awkward>=2", "vector>=1", "pyhepmc>=2.13", "pyarrow>=14"]
test = ["pytest>=8", "pytest-cov>=5"]
all = ["uproot>=5", "awkward>=2", "vector>=1", "pyhepmc>=2.13", "pyarrow>=14", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
qis-make-ntuples = "qis_ttbar.cli:make_ntuples_main"
qis-tomography = "qis_ttbar.cli:tomography_main"
qis-validate = "qis_ttbar.cli:validate_main"
qis-level-b = "qis_ttbar.cli:level_b_main"
qis-level-c = "qis_ttbar.cli:level_c_main"

[tool.setuptools.packages.find]
include = ["qis_ttbar*"]

[tool.pytest.ini_options]
testpaths = ["tests/qis"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
